<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta TCG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Detalle de carta</h1>
    <a href="catalogo.html" class="btn">Volver al catálogo</a>
  </header>

  <section id="detalle"></section>

  <script>
    // Leer parámetro id de la URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    // Si no hay id, mostrar mensaje
    if (!id) {
      document.getElementById('detalle').innerHTML = `
        <p>No se recibió ningún ID de carta.</p>
      `;
      return;
    }

    // Cargar inventario
    fetch('inventario.json')
      .then(response => response.json())
      .then(data => {

        // Buscar la carta (comparación segura)
        const carta = data.find(c => String(c.id) === String(id));

        const detalle = document.getElementById('detalle');

        if (!carta) {
          detalle.innerHTML = `
            <p>No se encontró la carta con ID ${id}.</p>
          `;
          return;
        }

        // Mostrar la carta
        detalle.innerHTML = `
          <img src="${carta.imagen}" alt="${carta.nombre}">
          <h2>${carta.nombre}</h2>
          <p>${carta.set} - ${carta.numero}</p>
          <p>Estado: ${carta.estado}</p>
          <p>Precio: ${carta.precio}</p>
          <p class="nota">
            La carta se muestra tal como está. El cliente evalúa centrado y condición visual
            antes de decidir si enviarla a gradear.
          </p>
        `;
      })
      .catch(error => {
        console.error('Error cargando inventario.json:', error);
        document.getElementById('detalle').innerHTML = `
          <p>Hubo un problema al cargar el inventario.</p>
        `;
      });
  </script>
</body>
</html>
