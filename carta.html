<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta TCG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Detalle de carta</h1>
    <a href="catalogo.html" class="btn">Volver al catálogo</a>
  </header>

  <section id="detalle"></section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    fetch('inventario.json')
      .then(response => response.json())
      .then(data => {
      const botonCarrito = document.getElementById('agregarCarrito');

      botonCarrito.addEventListener('click', () => {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

        carrito.push({
          id: carta.id,
          nombre: carta.nombre,
          precio: carta.precio,
          imagen: carta.imagen
        });

        localStorage.setItem('carrito', JSON.stringify(carrito));
        alert("Carta agregada al carrito");
      });

        // Comparación segura
        const carta = data.find(c => String(c.id) === String(id));

        const detalle = document.getElementById('detalle');

        if (!carta) {
          detalle.innerHTML = `
            <p>No se encontró la carta con ID ${id}.</p>
          `;
          return;
        }

        detalle.innerHTML = `
          <img src="${carta.imagen}" alt="${carta.nombre}">
          <h2>${carta.nombre}</h2>
          <p>${carta.set} - ${carta.numero}</p>
          <p>Estado: ${carta.estado}</p>
          <p>Precio: ${carta.precio}</p>
<button id="agregarCarrito" class="btn">Agregar al carrito</button>

          <h3>Reverso</h3>
          <img src="${carta.reverso}" alt="Reverso de ${carta.nombre}">

          <p class="nota">
            La carta se muestra tal como está. El cliente evalúa centrado y condición visual
            antes de decidir si enviarla a gradear.
          </p>
        `;
      })
      .catch(error => {
        document.getElementById('detalle').innerHTML = `
          <p>Error cargando inventario.json</p>
        `;
      });
  </script>
</body>
</html>
